data_checks = ["BTC 20日、50日与200日移动均线", "BTC 14日RSI与近30日最高/最低收盘", "BTC当日成交量相对20日均量", "BTC永续资金费率与未平仓量", "BTC现货ETF最近完整交易日净流量", "BTC链上长期持有者或交易所净流量", "与BTC相关的美元利率和流动性指标"]
