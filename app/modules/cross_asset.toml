source_requirements = ["BTC 权威报价使用 Binance BTC/USDT，并用 CoinGecko 等交叉核验", "BTC技术结构使用Binance现货日线K线程序计算，衍生品使用Binance Futures资金费率与未平仓量；不同口径不得混用", "BTC现货ETF净流量优先使用基金发行人、交易所或Farside等逐日汇总；新闻对流入流出的描述不能替代精确净流量", "链上指标必须来自具名链上数据提供方并保留指标口径；未取得精确值时标记数据不可用", "WTI 官方结算必须使用 NYMEX CL 近月合约官方数据，MCL 仅作微型合约映射；未取得官方结算时可另外输出 Yahoo Chart 的 CL 近月合约参考价，但不得标为官方结算", "Google News RSS 中英文检索为必查", "GDELT 与 Marketaux 对 BTC/原油仅作可选增强", "Yahoo Chart API 可用于 WTI 参考行情，不得将 Yahoo 参考价表述为 NYMEX 官方结算", "每条事实记录媒体名或机构名及 URL"]
search_terms_zh = ["比特币 ETF 资金流 监管 链上 衍生品", "WTI 原油 OPEC 库存 地缘政治 美元"]
search_terms_en = ["bitcoin price ETF flows SEC legislation institutional on-chain derivatives", "WTI oil OPEC EIA API inventory geopolitics demand forecast dollar"]
no_news_policy = "逐个标的完成全部专属主题检查；窗口内确无重要新闻时明确写无重大新闻"
background_policy = "只补充窗口外但仍在发酵的近期重要背景；标注原始日期并设置 outside_window=true"

